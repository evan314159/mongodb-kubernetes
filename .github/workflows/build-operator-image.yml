name: Build operator image

# Builds the operator image from a chosen ref and pushes it to GHCR.
# Intended for testing branches on forks; official images are built via Evergreen.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        type: string
        default: fix-hostusers
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mongodb-kubernetes" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "reftag=$(echo "$REF" | sed 's/[^A-Za-z0-9_.-]/-/g')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mongodb-kubernetes-operator/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            version=${{ steps.meta.outputs.sha }}
            log_automation_config_diff=false
            use_race=false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.reftag }}
